<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>%VITE_APP_WEBSITE_NAME% | %VITE_APP_WEBSITE_TAGLINE%</title>
  <meta name="description" content="Nofino Rural Finance Private Limited Nofino Business Bank " />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css">


    <style>
      #loader-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #1a1a2e;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      .loader-container {
        width: 300px;
        text-align: center;
      }

      .progress-bar {
        width: 100%;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        overflow: hidden;
        margin: 20px 0;
      }

      .progress-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #00d2ff, #3a47d5);
        border-radius: 2px;
        transition: width 0.3s ease;
        animation: loading 2s ease-in-out infinite;
      }

      @keyframes loading {
        0% { width: 0%; }
        50% { width: 70%; }
        100% { width: 100%; }
      }

      .loader-text {
        color: white;
        font-size: 14px;
        letter-spacing: 1px;
      }

      .percentage {
        font-size: 24px;
        font-weight: bold;
        color: #00d2ff;
        margin-top: 10px;
      }
    </style>

  </head>
  <body class="bg-gray-200 dark:bg-gray-900">
    <!-- Loader wrapper -->
    <div id="loader-wrapper">
      <div class="loader-container">
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
        <!-- <div class="loader-text">Loading Application</div> -->
        <div class="percentage" id="loading-percentage">0%</div>
      </div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous">
    </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
  


  <script>
      // Simulate loading progress
      let progress = 0;
      const interval = setInterval(() => {
        if (progress < 90) {
          progress += Math.random() * 10;
          progress = Math.min(progress, 90);
          document.getElementById('loading-percentage').textContent = Math.floor(progress) + '%';
          document.querySelector('.progress-fill').style.width = progress + '%';
        }
      }, 2000);
      
      // Complete progress when React loads
      window.completeLoading = () => {
        clearInterval(interval);
        const fill = document.querySelector('.progress-fill');
        const percentage = document.getElementById('loading-percentage');
        fill.style.width = '100%';
        percentage.textContent = '100%';
        setTimeout(() => {
          const loader = document.getElementById('loader-wrapper');
          loader.style.opacity = '0';
          setTimeout(() => {
            loader.style.display = 'none';
          }, 5000);
        }, 5000);
      };
    </script>
  </body>
</html>
